name: Release

on:
  push:
    tags:
      # Only version tags start a release. A bare "v" prefix would also match
      # names like "vendor-audit", which would start a run that can only fail
      # the tag/version check.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to run against (for example v0.2.0b1)"
        required: true
        type: string
      dry_run:
        description: "Run every check but skip the PyPI upload"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report the release mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "event_name     = ${EVENT}"
          echo "inputs.dry_run = '${DRY_RUN}'"
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "mode           = DRY RUN (the PyPI upload and everything after it will be skipped)"
          else
            echo "mode           = REAL RELEASE (the PyPI upload will run)"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate tag matches package version
        env:
          REF_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          echo "release version verified: $PACKAGE_VERSION"
      # Tests run before anything is built, on the exact commit the tag names.
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict src
      - run: python -m pytest --cov=agent_policy_pack --cov-branch
      - run: python -m bandit -r src
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Skipped on a dry run. `inputs.dry_run` is empty on a push event,
    # so the event check comes first: a push is always a real release.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Refuse to upload during a dry run
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT}" != "push" ] && [ "${DRY_RUN}" != "false" ]; then
            echo "This job must not run during a dry run. Failing instead of uploading."
            exit 1
          fi
          echo "Confirmed a real release: event=${EVENT} dry_run='${DRY_RUN}'"
      # Pinned by commit SHA rather than the release/v1 branch, which is the
      # most mutable reference available, on the step that uploads to PyPI.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
